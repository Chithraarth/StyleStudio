name: Build and push StyleStudio images

on:
  push:
    branches: [prod]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/stylestudio-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/stylestudio-backend:${{ github.sha }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          build-args: |
            VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/stylestudio-web:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/stylestudio-web:${{ github.sha }}

      - name: Build and push nginx image
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/stylestudio-nginx:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/stylestudio-nginx:${{ github.sha }}
