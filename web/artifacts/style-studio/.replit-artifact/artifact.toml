kind = "web"
previewPath = "/"
title = "Style Studio"
version = "1.0.0"
id = "artifacts/style-studio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24764

[services.development]
run = "pnpm --filter @workspace/style-studio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/style-studio", "run", "build" ]
serve = "static"
publicDir = "artifacts/style-studio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24764"
BASE_PATH = "/"
